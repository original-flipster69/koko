version: 2

project_name: koko

before:
  hooks:
    - go mod tidy

builds:
  - id: koko
    binary: koko
    main: ./cmd/koko
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version=v{{.Version}}
    hooks:
      post:
        - cmd: mv {{ .Path }} {{ .Path }}.exe
          only: windows

archives:
  - id: default
    name_template: "koko_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE*
      - README*
  - id: windows
    name_template: "koko_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [zip]
    files:
      - LICENSE*
      - README*
    only: windows

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

release:
  gitea:
    owner: original-flipster69
    name: koko
  draft: false
  prerelease: auto

changelog:
  sort: asc

gitea_urls:
  api: https://codeberg.org/api/v1
  download: https://codeberg.org